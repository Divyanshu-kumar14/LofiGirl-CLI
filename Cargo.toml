[package]
name = "LofiGirl-CLI"
version = "0.1.0"
edition = "2024"

[dependencies]
crossterm = "0.28"
dirs = "5.0"
ratatui = "0.29.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["rt", "rt-multi-thread", "macros", "process", "net", "io-util", "time", "sync"] }
toml = "0.8"
unicode-width = "0.2"
